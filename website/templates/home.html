{% extends "base.html" %} {% block title %}Home{% endblock %}{% block 
    content %}
    <h1 align="center">Bucketlist</h1>
    <ul class="list-group list-group-flush" id="blitem">
        {% for blitem in user.bl_items %}
        <li class="list-group-item">
            {{ blitem.text }}
            <button type="button" class="close" onclick="deleteItem({{ blitem.id }})">
                <span aria-hidden="true">&times;</span>
            </button>
        </li>
        {% endfor %}
    </ul>
    <form method="POST">
        <textarea name="blitem" id="blitem-input" class="form-control"></textarea>
        <br />
        <div align="center">
            <button type="submit" class="btn btn-primary">Add Item</button>
        </div>
    </form>
    {% endblock %}
