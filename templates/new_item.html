<!DOCTYPE html>
<html lang="en">
<head>
    <title>New Item</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .cursor-pointer { cursor: pointer; }
        .list-group-item:hover { background-color: #f8f9fa; }
    </style>
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-0 p-4">
                <h3 class="mb-4">New Entry</h3>
                
                <form method="POST" action="/new" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Title</label>
                        <input type="text" name="title" class="form-control" required>
                    </div>

                    <div class="mb-3 p-3 bg-white border rounded">
                        <div class="form-check form-switch mb-2">
                            <input class="form-check-input" type="checkbox" name="is_location" id="isLocationCheck">
                            <label class="form-check-label fw-bold" for="isLocationCheck">Location Entity</label>
                        </div>
                        <div class="d-none" id="country-select-group">
                            <select name="country" class="form-select">
                                <option value="">-- Select --</option>
                                {% for code, data in COUNTRIES %}
                                    <option value="{{ code }}">{{ data.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Category</label>
                        <div class="input-group">
                            <select name="existing_category" class="form-select">
                                {% for cat in categories %}
                                    <option value="{{ cat.name }}">{{ cat.name }}</option>
                                {% endfor %}
                            </select>
                            <input type="text" name="new_category" class="form-control" placeholder="New category">
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Status</label>
                        <select name="status" id="status-select" class="form-select">
                            <option value="Planned">Planned</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>
                    
                    <div class="row mb-3 d-none" id="completion-date-group">
                        <div class="col-6">
                            <label class="form-label fw-bold">Month</label>
                            <select name="completion_month" class="form-select">
                                <option value=""></option>
                                <option value="01">Jan</option><option value="02">Feb</option>
                                <option value="03">Mar</option><option value="04">Apr</option>
                                <option value="05">May</option><option value="06">Jun</option>
                                <option value="07">Jul</option><option value="08">Aug</option>
                                <option value="09">Sep</option><option value="10">Oct</option>
                                <option value="11">Nov</option><option value="12">Dec</option>
                            </select>
                        </div>
                        <div class="col-6">
                            <label class="form-label fw-bold">Year</label>
                            <input type="text" name="completion_date" class="form-control">
                        </div>
                    </div>

                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" name="has_blog" id="hasBlogCheck">
                        <label class="form-check-label fw-bold" for="hasBlogCheck">Enable Extended Content</label>
                    </div>

                    <div class="p-3 bg-white border rounded mb-3 d-none" id="blog-options-group">
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" name="has_text" id="hasTextCheck">
                            <label class="form-check-label fw-semibold" for="hasTextCheck">Text</label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" name="has_checklist" id="hasChecklistCheck">
                            <label class="form-check-label fw-semibold" for="hasChecklistCheck">Checklist</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="has_music" id="hasMusicCheck">
                            <label class="form-check-label fw-semibold" for="hasMusicCheck">Audio Track</label>
                        </div>
                    </div>

                    <div class="mb-3 d-none" id="blog-description-group">
                        <textarea name="description" class="form-control" rows="4"></textarea>
                    </div>

                    <div class="mb-3 d-none" id="checklist-builder-group">
                        <div id="checklist-inputs" class="vstack gap-2 mb-2">
                            <div class="input-group">
                                <input type="text" name="checklist_texts[]" class="form-control">
                                <button type="button" class="btn btn-outline-danger" onclick="removeCheckRow(this)">&times;</button>
                            </div>
                        </div>
                        <button type="button" class="btn btn-outline-dark btn-sm" onclick="addCheckRow()">+ Add</button>
                    </div>

                    <div class="mb-3 d-none" id="music-builder-group">
                        <div class="position-relative">
                            <input type="text" id="musicSearchInput" class="form-control" placeholder="Search API..." autocomplete="off">
                            <div id="musicSearchResults" class="list-group position-absolute w-100 shadow-sm" style="z-index: 1000; max-height: 250px; overflow-y: auto;"></div>
                        </div>
                        <input type="hidden" name="music_title" id="music_title">
                        <input type="hidden" name="music_artist" id="music_artist">
                        <input type="hidden" name="music_cover" id="music_cover">
                        <input type="hidden" name="music_preview" id="music_preview">

                        <div id="selectedMusicCard" class="card mt-3 d-none border-success bg-success bg-opacity-10">
                            <div class="card-body p-2 d-flex align-items-center">
                                <img id="selectedMusicCover" src="" width="50" class="rounded me-3 shadow-sm">
                                <div>
                                    <h6 class="mb-0 fw-bold text-success" id="selectedMusicTitle">Title</h6>
                                    <small class="text-muted" id="selectedMusicArtist">Artist</small>
                                </div>
                                <div class="ms-auto">
                                    <button type="button" class="btn btn-sm btn-outline-danger" onclick="clearMusicSelection()">Remove</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Media</label>
                        <input type="file" name="images" id="imageInput" class="form-control" accept="image/*,video/mp4,video/quicktime,video/webm,video/ogg">
                    </div>
                    
                    <div class="d-flex justify-content-between">
                        <a href="/admin_dashboard" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const statusSelect = document.getElementById('status-select');
        const dateGroup = document.getElementById('completion-date-group');
        function toggleDates() {
            if (statusSelect.value === 'Completed') { dateGroup.classList.remove('d-none'); dateGroup.classList.add('d-flex'); } 
            else { dateGroup.classList.remove('d-flex'); dateGroup.classList.add('d-none'); }
        }
        statusSelect.addEventListener('change', toggleDates);
        toggleDates();

        const locCheck = document.getElementById('isLocationCheck');
        const countryGroup = document.getElementById('country-select-group');
        function toggleLocation() {
            if(locCheck.checked) { countryGroup.classList.remove('d-none'); } 
            else { countryGroup.classList.add('d-none'); countryGroup.querySelector('select').value = ""; }
        }
        locCheck.addEventListener('change', toggleLocation);
        toggleLocation();

        const blogCheck = document.getElementById('hasBlogCheck');
        const blogOptionsGroup = document.getElementById('blog-options-group');
        const textCheck = document.getElementById('hasTextCheck');
        const descGroup = document.getElementById('blog-description-group');
        const checklistCheck = document.getElementById('hasChecklistCheck');
        const checklistGroup = document.getElementById('checklist-builder-group');
        const musicCheck = document.getElementById('hasMusicCheck');
        const musicGroup = document.getElementById('music-builder-group');
        const imageInput = document.getElementById('imageInput');

        function toggleBlog() {
            if (blogCheck.checked) {
                blogOptionsGroup.classList.remove('d-none');
                imageInput.setAttribute('multiple', '');
            } else {
                blogOptionsGroup.classList.add('d-none');
                textCheck.checked = false; checklistCheck.checked = false; musicCheck.checked = false;
                toggleText(); toggleChecklist(); toggleMusic();
                imageInput.removeAttribute('multiple');
            }
        }
        function toggleText() { if (textCheck.checked) descGroup.classList.remove('d-none'); else descGroup.classList.add('d-none'); }
        function toggleChecklist() { if (checklistCheck.checked) checklistGroup.classList.remove('d-none'); else checklistGroup.classList.add('d-none'); }
        function toggleMusic() { if (musicCheck.checked) musicGroup.classList.remove('d-none'); else musicGroup.classList.add('d-none'); }

        blogCheck.addEventListener('change', toggleBlog);
        textCheck.addEventListener('change', toggleText);
        checklistCheck.addEventListener('change', toggleChecklist);
        musicCheck.addEventListener('change', toggleMusic);
        toggleBlog();

        const searchInput = document.getElementById('musicSearchInput');
        const resultsBox = document.getElementById('musicSearchResults');
        let searchTimeout;
        searchInput.addEventListener('input', function() {
            clearTimeout(searchTimeout);
            const query = this.value.trim();
            if (query.length < 3) { resultsBox.innerHTML = ''; return; }
            searchTimeout = setTimeout(async () => {
                const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=5`);
                const data = await res.json();
                resultsBox.innerHTML = '';
                data.results.forEach(track => {
                    const a = document.createElement('a');
                    a.className = 'list-group-item list-group-item-action d-flex align-items-center cursor-pointer';
                    a.innerHTML = `<img src="${track.artworkUrl60}" class="me-3 rounded"><div><div class="fw-bold text-dark">${track.trackName}</div><small class="text-muted">${track.artistName}</small></div>`;
                    a.onclick = () => selectMusic(track);
                    resultsBox.appendChild(a);
                });
            }, 500); 
        });
    });

    function selectMusic(track) {
        document.getElementById('music_title').value = track.trackName;
        document.getElementById('music_artist').value = track.artistName;
        document.getElementById('music_cover').value = track.artworkUrl100.replace('100x100bb', '600x600bb');
        document.getElementById('music_preview').value = track.previewUrl;
        document.getElementById('selectedMusicTitle').innerText = track.trackName;
        document.getElementById('selectedMusicArtist').innerText = track.artistName;
        document.getElementById('selectedMusicCover').src = track.artworkUrl100;
        document.getElementById('selectedMusicCard').classList.remove('d-none');
        document.getElementById('musicSearchResults').innerHTML = '';
        document.getElementById('musicSearchInput').value = '';
    }

    function clearMusicSelection() {
        document.getElementById('music_title').value = '';
        document.getElementById('music_artist').value = '';
        document.getElementById('music_cover').value = '';
        document.getElementById('music_preview').value = '';
        document.getElementById('selectedMusicCard').classList.add('d-none');
    }

    function addCheckRow() {
        const container = document.getElementById('checklist-inputs');
        const row = document.createElement('div');
        row.className = 'input-group';
        row.innerHTML = `<input type="text" name="checklist_texts[]" class="form-control"><button type="button" class="btn btn-outline-danger" onclick="removeCheckRow(this)">&times;</button>`;
        container.appendChild(row);
    }
    function removeCheckRow(btn) {
        const row = btn.closest('.input-group');
        if (document.querySelectorAll('#checklist-inputs .input-group').length > 1) row.remove();
        else row.querySelector('input').value = '';
    }
</script>
</body>
</html>
