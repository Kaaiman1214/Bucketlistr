<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
      integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
      crossorigin="anonymous"
    />
    <style>
      .tile {
        min-height: 110px;
        border-left-width: 4px;
        border-left-color: #6c757d;
        transition: box-shadow 0.15s ease;
      }
      .tile.tile-link:hover { box-shadow: 0 0.25rem 0.75rem rgba(0, 0, 0, 0.15); }
      .tile.tile-done { border-left-color: #28a745; background: #f6fbf7; }
      .tile .card-title a { text-decoration: none; }
      .tile-edit { position: absolute; top: 0.6rem; right: 0.8rem; z-index: 2; color: #6c757d; background: rgba(255, 255, 255, 0.85); border-radius: 50%; padding: 0.2rem 0.5rem; }
      .tile-edit:hover { color: #343a40; }
      .description { white-space: pre-wrap; }
      .category-toggle { font-size: 1.25rem; font-weight: 500; text-decoration: none !important; }
      .category-toggle .fa { display: inline-block; width: 1.1em; transition: transform 0.15s ease; }
      .category-toggle.collapsed .fa { transform: rotate(-90deg); }
      .flag { width: 1.25em; height: 1.25em; vertical-align: -0.2em; margin-right: 0.35rem; }
      .progress-slim { height: 0.6rem; }
      .tile-photo { height: 220px; object-fit: cover; }
      .photo-card { width: 140px; margin: 0 0.75rem 0.75rem 0; }
      .photo-frame { position: relative; }
      .form-photo { width: 100%; height: 100px; object-fit: cover; border-radius: 0.25rem; }
      .photo-badge { position: absolute; top: 0.3rem; left: 0.3rem; }
      .photo-card:not(:first-child) .photo-badge { display: none; }
      #photo-carousel { background: #212529; border-radius: 0.25rem; overflow: hidden; }
      #photo-carousel .carousel-item { height: 60vh; min-height: 240px; }
      .photo-slide { width: 100%; height: 100%; object-fit: contain; }
      .photo-counter { position: absolute; right: 0.75rem; bottom: 0.5rem; z-index: 15; }
      @media (prefers-reduced-motion: reduce) { .tile, .category-toggle .fa { transition: none; } }
    </style>

    <title>{% block title %}{{ site_name }}{% endblock %}</title>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <a class="navbar-brand" href="/">{{ site_name }}</a>
      <button
        class="navbar-toggler"
        type="button"
        data-toggle="collapse"
        data-target="#navbar"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbar">
        <div class="navbar-nav">
          <a class="nav-item nav-link" id="home" href="/">Home</a>
          {% if user.is_authenticated %}
            <a class="nav-item nav-link" id="logout" href="/logout">Logout</a>
          {% else %}
            <a class="nav-item nav-link" id="login" href="/login">Login</a>
          {% endif %}
        </div>
        <form class="form-inline ml-lg-auto my-2 my-lg-0" method="GET" action="{{ url_for('views.home') }}" role="search">
          <input class="form-control form-control-sm mr-2" type="search" name="q"
                 value="{{ request.args.get('q', '') if request.endpoint == 'views.home' else '' }}"
                 placeholder="Search items" aria-label="Search items" />
          <button class="btn btn-outline-light btn-sm" type="submit" aria-label="Search"><i class="fa fa-search"></i></button>
        </form>
      </div>
    </nav>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="close" data-dismiss="alert">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
      {% endfor %}
    {% endwith %}
    <div class="container">{% block content %} {% endblock %}</div>

    <script
      src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
      integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"
      integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"
      integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
      crossorigin="anonymous"
    ></script>
    <script
      type="text/javascript"
      src="{{ url_for('static', filename='index.js') }}"
    ></script>
  </body>
</html>
